name: Deploy QA NK to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Якщо Pages налаштовано на "Deploy from a branch", GitHub паралельно
      # публікує сирі файли репозиторію (пуста сторінка). Чекаємо, поки та
      # збірка завершиться, щоб наш зібраний сайт опублікувався останнім.
      - name: Wait for the branch-based Pages build
        uses: actions/github-script@v7
        with:
          script: |
            for (let i = 0; i < 30; i++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha, per_page: 50
              });
              const pending = data.workflow_runs.filter(r =>
                r.name === 'pages build and deployment' && r.status !== 'completed');
              if (!pending.length) return;
              core.info(`Waiting for ${pending.length} branch-based Pages run(s)...`);
              await new Promise(r => setTimeout(r, 10000));
            }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
